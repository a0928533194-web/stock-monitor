<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股成分股監測 App</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f7f9; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .app-card { background: white; width: 100%; max-width: 500px; border-radius: 20px; padding: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .total-box { background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%); color: white; border-radius: 15px; padding: 15px; text-align: center; margin-bottom: 15px; }
        #total-sum { font-size: 32px; font-weight: bold; }
        .stock-list { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
        .stock-list th { border-bottom: 2px solid #f0f0f0; padding: 8px 2px; text-align: left; color: #7f8c8d; }
        .stock-list td { padding: 10px 2px; border-bottom: 1px solid #f9f9f9; word-break: break-all; }
        
        /* 設定欄位寬度比例 */
        .col-name { width: 22%; }
        .col-ratio { width: 18%; }
        .col-prev { width: 20%; }
        .col-now { width: 20%; }
        .col-contri { width: 20%; }

        .up { color: #e74c3c; font-weight: bold; }
        .down { color: #27ae60; font-weight: bold; }
        .update-time { font-size: 11px; color: #bdc3c7; text-align: center; margin-top: 10px; }
        .btn-run { background: #eee; color: #7f8c8d; border: none; width: 100%; padding: 10px; border-radius: 10px; margin-top: 10px; cursor: pointer; text-decoration: none; display: block; text-align: center; font-size: 14px; }
    </style>
</head>
<body>
    <div class="app-card">
        <div class="total-box">
            <div style="font-size: 13px; opacity: 0.9;">預估總漲跌貢獻</div>
            <div id="total-sum">--</div>
        </div>
        <table class="stock-list">
            <thead>
                <tr>
                    <th class="col-name">股票</th>
                    <th class="col-ratio">比例</th>
                    <th class="col-prev">昨日</th>
                    <th class="col-now">現價</th>
                    <th class="col-contri">貢獻值</th>
                </tr>
            </thead>
            <tbody id="stock-details">
                <tr><td colspan="5" style="text-align:center; padding:20px;">更新中...</td></tr>
            </tbody>
        </table>
        <div class="update-time" id="last-update">尚未更新</div>
        <a class="btn-run" href="https://github.com/a0928533194-web/stock-monitor/actions">🔄 點此更新數據</a>
    </div>
</body>
</html>
