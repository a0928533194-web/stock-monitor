name: Daily_Stock_Monitor
on:
  workflow_dispatch: # 讓你可以手動點按鈕跑

jobs:
  run_script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - run: pip install yfinance pandas
      - run: python monitor.py.py
