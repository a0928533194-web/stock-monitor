<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店頭基金監測站</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 5px;
        }
        /* 更新時間顯示樣式 */
        .update-info {
            text-align: center;
            color: #666;
            font-size: 0.85em;
            margin-bottom: 20px;
            background: #eee;
            padding: 5px 10px;
            border-radius: 20px;
            display: inline-block;
            width: fit-content;
            align-self: center;
        }
        #update-time {
            font-weight: bold;
            color: #007bff;
        }
        .total-card {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .total-label {
            font-size: 1.1em;
            color: #555;
        }
        #total-sum {
            font-size: 2.5em;
            font-weight: bold;
            margin-top: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9em;
        }
        th {
            background-color: #f2f2f2;
            padding: 10px;
            text-align: left;
            border-bottom: 2px solid #ddd;
        }
        td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .up { color: #eb4d4b; font-weight: bold; }
        .down { color: #2ecc71; font-weight: bold; }
        
        /* 手動按鈕樣式 */
        .manual-btn {
            display: block;
            text-align: center;
            padding: 12px;
            background: #007bff;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>店頭基金監測站</h1>
        
        <div style="display: flex; justify-content: center;">
            <div class="update-info">
                最後更新 (台灣)：<span id="update-time">等待數據載入...</span>
            </div>
        </div>

        <div class="total-card">
            <div class="total-label">今日預估總漲跌貢獻</div>
            <div id="total-sum">0.0000</div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>成分股</th>
                    <th>權重</th>
                    <th>昨收</th>
                    <th>現價</th>
                    <th>貢獻</th>
                </tr>
            </thead>
            <tbody id="stock-details">
                </tbody>
        </table>

        <a href="https://github.com/您的帳號/您的儲存庫/actions" class="manual-btn">
            🔄 數據未更新？前往手動觸發
        </a>
    </div>

</body>
</html>
