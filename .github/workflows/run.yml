name: Daily_Stock_Monitor

on:
  # 1. 讓您可以隨時在手機或電腦手動點擊按鈕觸發
  workflow_dispatch:

  # 2. 加入定時更新 (週一至週五)
  schedule:
    # 台灣時間 09:30、11:00、13:00 各跑一次 (對應 UTC 01:30, 03:00, 05:00)
    - cron: '30 1 * * 1-5'
    - cron: '0 3 * * 1-5'
    - cron: '0 5 * * 1-5'

jobs:
  run_script:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install packages
        run: |
          pip install yfinance pandas

      - name: Run Python script
        run: python monitor.py.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          # 先把 Python 改好的 index.html 暫存起來
          git add index.html
          
          # 暫存目前的改動 (Stash)，讓 Git 乾淨地拉取遠端更新，解決截圖中的衝突報錯
          git stash
          
          # 拉取遠端最新的程式碼，避免衝突
          git pull --rebase origin main
          
          # 把剛才暫存的 index.html 改動拿回來
          git stash pop || echo "無暫存資料可還原"
          
          # 再次確認加入改動並提交
          git add index.html
          git commit -m "自動更新數據: $(date +'%Y-%m-%d %H:%M:%S')" || echo "資料無變動，跳過提交"
          
          # 推送到 GitHub
          git push
