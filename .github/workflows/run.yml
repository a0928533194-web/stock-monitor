name: Daily_Stock_Monitor

on:
  workflow_dispatch:
  schedule:
    # 這裡的設定對應台灣時間 (UTC+8)
    # 01:00 UTC = 09:00 TW (開盤)
    - cron: '0 1 * * 1-5'
    - cron: '30 1 * * 1-5'
    # 02:00 UTC = 10:00 TW
    - cron: '0 2 * * 1-5'
    - cron: '30 2 * * 1-5'
    # 03:00 UTC = 11:00 TW
    - cron: '0 3 * * 1-5'
    - cron: '30 3 * * 1-5'
    # 04:00 UTC = 12:00 TW
    - cron: '0 4 * * 1-5'
    - cron: '30 4 * * 1-5'
    # 05:00 UTC = 13:00 TW
    - cron: '0 5 * * 1-5'
    - cron: '30 5 * * 1-5' # 13:30 TW (收盤前)

permissions:
  contents: write

jobs:
  run_script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install yfinance pandas
      - run: python monitor.py.py
      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add index.html
          git commit -m "自動更新數據: $(date)" || echo "No changes"
          git push
