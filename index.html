<div class="select-container">
    <select id="fundSelector" class="fund-select" onchange="switchFund(this.value)">
        <option value="yuanta">元大店頭基金</option>
        <option value="shinkin_three">新光大三通基金</option>
        </select>
</div>

<div id="sector-yuanta" class="fund-section active">
    </div>

<div id="sector-shinkin_three" class="fund-section">
    </div>

<script>
function switchFund(fundValue) {
    document.querySelectorAll('.fund-section').forEach(s => s.classList.remove('active'));
    document.getElementById('sector-' + fundValue).classList.add('active');
}
</script>
