name: Daily_Stock_Monitor

on:
  # 1. 讓您可以隨時在手機手動點擊按鈕觸發
  workflow_dispatch:

  # 2. 加入定時更新 (週一至週五)
  schedule:
    # 台灣時間 09:30、11:00、13:00 各跑一次 (對應 UTC 01:30, 03:00, 05:00)
    - cron: '30 1 * * 1-5'
    - cron: '0 3 * * 1-5'
    - cron: '0 5 * * 1-5'

jobs:
  run_script:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # 確保能夠拉取最新的 Commit，避免 Push 衝突
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install packages
        run: |
          pip install yfinance pandas

      - name: Run Python script
        run: python monitor.py.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # 先拉取遠端最新變動，防止多次手動觸發導致的衝突
          git pull --rebase origin main
          git add index.html
          # 如果 index.html 沒變動就跳過，不會報錯
          git commit -m "自動更新數據: $(date +'%Y-%m-%d %H:%M:%S')" || exit 0
          git push
