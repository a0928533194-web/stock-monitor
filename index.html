<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股成分股監測 App</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #f4f7f9; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .app-card { background: white; width: 100%; max-width: 500px; border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .total-box { background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%); color: white; border-radius: 18px; padding: 20px; text-align: center; margin-bottom: 20px; }
        #total-sum { font-size: 36px; font-weight: bold; }
        .stock-list { width: 100%; border-collapse: collapse; font-size: 14px; }
        .stock-list th { border-bottom: 2px solid #f0f0f0; padding: 10px 5px; text-align: left; color: #7f8c8d; }
        .stock-list td { padding: 12px 5px; border-bottom: 1px solid #f9f9f9; }
        .up { color: #e74c3c; font-weight: bold; }
        .down { color: #27ae60; font-weight: bold; }
        .update-time { font-size: 12px; color: #bdc3c7; text-align: center; margin-top: 15px; }
        .btn-run { background: #eee; color: #7f8c8d; border: none; width: 100%; padding: 12px; border-radius: 10px; margin-top: 10px; cursor: pointer; text-decoration: none; display: block; text-align: center; }
    </style>
</head>
<body>
    <div class="app-card">
        <div class="total-box">
            <div style="font-size: 14px; opacity: 0.9;">預估總漲跌貢獻</div>
            <div id="total-sum">--</div>
        </div>
        <table class="stock-list">
            <thead>
                <tr>
                    <th>股票</th>
                    <th>比例</th> <th>現價</th>
                    <th>貢獻值</th>
                </tr>
            </thead>
            <tbody id="stock-details">
                <tr><td colspan="4" style="text-align:center; padding:30px;">更新中...</td></tr>
            </tbody>
        </table>
        <div class="update-time" id="last-update">尚未更新</div>
        <a class="btn-run" href="https://github.com/a0928533194-web/stock-monitor/actions">🔄 點此更新數據</a>
    </div>
</body>
</html>
