<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股成分股監測 App</title>
    <style>
        /* 基礎樣式 */
        body { 
            font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, "PingFang TC", "Microsoft JhengHei", sans-serif; 
            background: #f4f7f9; 
            margin: 0; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        /* 卡片容器 */
        .app-card { 
            background: white; 
            width: 100%; 
            max-width: 480px; 
            border-radius: 24px; 
            padding: 24px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); 
        }

        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0; color: #2c3e50; font-size: 22px; }

        /* 總分顯示區 */
        .total-box { 
            background: linear-gradient(135deg, #1a5276 0%, #2980b9 100%); 
            color: white; 
            border-radius: 18px; 
            padding: 25px; 
            text-align: center; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 15px rgba(41, 128, 185, 0.3);
        }
        .total-label { font-size: 14px; opacity: 0.9; margin-bottom: 8px; }
        #total-sum { font-size: 42px; font-weight: 800; }

        /* 表格樣式 */
        .list-container { overflow-x: auto; }
        .stock-list { width: 100%; border-collapse: collapse; font-size: 15px; }
        .stock-list th { 
            border-bottom: 2px solid #f0f0f0; 
            padding: 12px 8px; 
            text-align: left; 
            color: #7f8c8d; 
            font-weight: 600;
        }
        .stock-list td { 
            padding: 14px 8px; 
            border-bottom: 1px solid #f9f9f9; 
            color: #34495e;
        }

        /* 漲跌顏色標示 (台灣習慣：紅漲綠跌) */
        .up { color: #e74c3c; font-weight: bold; }   /* 紅色 */
        .down { color: #27ae60; font-weight: bold; } /* 綠色 */

        .update-time { 
            font-size: 12px; 
            color: #bdc3c7; 
            text-align: center; 
            margin-top: 20px; 
        }

        /* 底部按鈕 */
        .btn-run { 
            background: #ecf0f1; 
            color: #7f8c8d; 
            border: none; 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            margin-top: 15px; 
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="app-card">
        <div class="header">
            <h2>📈 即時貢獻監測</h2>
        </div>
        
        <!-- 總貢獻區域 -->
        <div class="total-box">
            <div class="total-label">預估總漲跌貢獻</div>
            <div id="total-sum">--</div>
        </div>

        <!-- 詳細清單表格 -->
        <div class="list-container">
            <table class="stock-list">
                <thead>
                    <tr>
                        <th>股票名稱</th>
                        <th>昨日</th>
                        <th>現價</th>
                        <th>貢獻</th>
                    </tr>
                </thead>
                <tbody id="stock-details">
                    <!-- Python 會自動將每一列股票填入這裡 -->
                    <tr>
                        <td colspan="4" style="text-align:center; color:#ccc; padding:30px;">等待數據更新中...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="update-time" id="last-update">尚未更新數據</div>
        
        <!-- 重新整理按鈕：引導回 GitHub 觸發 -->
        <a class="btn-run" href="https://github.com/a0928533194-web/stock-monitor/actions">
            🔄 點此去 GitHub 觸發更新
        </a>
    </div>

</body>
</html>
